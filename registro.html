<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FarbScout — Crear cuenta</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/login.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0b0b0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="assets/FARBSCOUT_LOGO.png" />
</head>
<body>
  <main class="page-shell auth-wrap">
    <div class="brand-logo-wrap">
      <img src="assets/FARBSCOUT_LOGO.png" alt="Logo FarbScout" class="brand-logo" />
    </div>
    <h1 class="title-grad auth-title">FarbScout</h1>
    <p class="auth-subtitle">Crea tu cuenta y empieza a explorar</p>

    <form id="register-form" class="auth-form" novalidate>
      <input id="reg-name" class="input-box" type="text" placeholder="Tu nombre" autocomplete="name" />
      <input id="reg-email" class="input-box" type="email" placeholder="Correo electrónico" autocomplete="email" />
      <div class="pass-wrap">
        <input id="reg-pass" class="input-box" type="password" placeholder="Contraseña (mín. 6 caracteres)" autocomplete="new-password" />
        <button type="button" class="pass-toggle" onclick="togglePasswordVisibility('reg-pass', this)">👁️</button>
      </div>
      <span id="reg-error" class="error-msg"></span>
      <button type="submit" class="btn-grad">Crear cuenta</button>
    </form>

    <div class="divider">o continúa con</div>

    <button type="button" id="btn-google" class="btn-google" onclick="handleGoogleAuth()">
      <svg width="18" height="18" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Continuar con Google
    </button>

    <p class="auth-footer">¿Ya tienes cuenta? <a href="index.html">Inicia sesión</a></p>
  </main>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById("register-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("reg-name").value.trim();
      const email = document.getElementById("reg-email").value.trim();
      const password = document.getElementById("reg-pass").value;
      const err = document.getElementById("reg-error");
      const btn = e.target.querySelector("button[type='submit']");

      if (!username) {
        err.textContent = "Ingresa tu nombre";
        return;
      }
      if (!email || !isValidEmail(email)) {
        err.textContent = "Ingresa un correo válido";
        return;
      }
      if (!password || password.length < 6) {
        err.textContent = "La contraseña debe tener al menos 6 caracteres";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Creando cuenta...";
      const result = await registerUserAccount({ username, email, password });
      btn.disabled = false;
      btn.textContent = "Crear cuenta";

      if (!result.ok) {
        err.textContent = result.error;
        return;
      }

      err.textContent = "";
      window.location.href = "onboarding.html";
    });

    async function handleGoogleAuth(btn) {
  if (btn) btn.disabled = true;
  try {
    const res = await loginWithGoogle();
    if (res.ok) {
      window.location.href = res.isNew ? "onboarding.html" : "scanner.html";
    } else if (res.error) {
      showToast(res.error);
    }
  } finally {
    if (btn) btn.disabled = false;
  }
}

      err.textContent = "";
      window.location.href = result.isNew ? "onboarding.html" : "scanner.html";
    }
    checkGoogleRedirectResult().then(res => {
  if (res && res.ok) {
    window.location.href = res.isNew ? "onboarding.html" : "scanner.html";
  } else if (res && res.error) {
    showToast(res.error);
  }
});
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }
    
  </script>
  
</body>
</html>
